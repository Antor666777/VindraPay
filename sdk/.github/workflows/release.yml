name: Release

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  id-token: write

concurrency:
  group: release-sdk
  cancel-in-progress: false

jobs:
  gate:
    name: Verify manual release gate
    runs-on: ubuntu-latest
    steps:
      - name: Check repository variable SDK_RELEASE_ENABLED
        run: |
          if [ "${{ vars.SDK_RELEASE_ENABLED }}" != "true" ]; then
            echo "::error::Release blocked. Set the repository variable SDK_RELEASE_ENABLED=true to enable manual releases."
            exit 1
          fi

  publish:
    name: Publish vindrapay-sdk to npm
    needs: gate
    runs-on: ubuntu-latest
    environment: npm
    defaults:
      run:
        working-directory: sdk
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 11.22.0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: sdk/pnpm-lock.yaml
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Publish changed packages
        working-directory: sdk
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npm config set //registry.npmjs.org/:_authToken "$NPM_TOKEN"
          pnpm exec changeset publish
          git push --follow-tags
