version: "2"
sql:
  - engine: "postgresql"
    schema: "./db/migrations/*.up.sql"
    queries: "./db/queries"
    gen:
      go:
        package: "db"
        out: "./internal/db"
        sql_package: "pgx/v5"
        emit_json_tags: true
        emit_interface: true
        emit_pointers_for_null_types: true
        overrides:
          - db_type: "pg_catalog.numeric"
            go_type: "*github.com/shopspring/decimal.Decimal"
            nullable: true
          - db_type: "numeric"
            go_type: "*github.com/shopspring/decimal.Decimal"
            nullable: true
          - db_type: "uuid"
            go_type: "*github.com/google/uuid.UUID"
            nullable: true
          - db_type: "pg_catalog.timestamptz"
            go_type: "time.Time"
          - db_type: "timestamptz"
            go_type: "time.Time"
          - db_type: "pg_catalog.numeric"
            go_type: "github.com/shopspring/decimal.Decimal"
          - db_type: "numeric"
            go_type: "github.com/shopspring/decimal.Decimal"
          - db_type: "uuid"
            go_type: "github.com/google/uuid.UUID"
